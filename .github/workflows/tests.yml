name: Tests

on:
  pull_request:
  push:
    branches: [main]
  # Create Release and Publish run these same gates on the commit they ship.
  workflow_call: {}

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test]" sqlalchemy
      - name: Test
        run: python -m pytest -v --junitxml="$RUNNER_TEMP/pytest-report.xml"

      - name: Summary
        if: always()
        continue-on-error: true
        uses: jnet-platform-factory/.github/actions/job-summary@v0.0.1
        with:
          title: pytest — Python ${{ matrix.python-version }}
          status: ${{ job.status }}
          rows: |
            Branch: ${{ github.head_ref || github.ref_name }}
            Commit: ${{ github.sha }}
          junit: ${{ runner.temp }}/pytest-report.xml

  vendored-import:
    # Services that ship only their own source tree vendor this repo at
    # src/platform_common with git subtree. That only works while every import
    # inside the package is relative, so prove it from a vendored layout.
    name: Imports cleanly when vendored
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/platform_common
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install aws-lambda-powertools pydantic PyJWT
      - name: Import every module
        id: imports
        run: |
          touch src/__init__.py
          python - <<'EOF'
          import importlib, pkgutil
          import src.platform_common.lambda_app_common as pkg
          for mod in pkgutil.walk_packages(pkg.__path__, pkg.__name__ + "."):
              importlib.import_module(mod.name)
              print("ok", mod.name)
          EOF

      - name: Summary
        if: always()
        continue-on-error: true
        uses: jnet-platform-factory/.github/actions/job-summary@v0.0.1
        with:
          title: Imports cleanly when vendored
          status: ${{ job.status }}
          rows: |
            Layout: src/platform_common
            Imports: ${{ steps.imports.outcome == 'success' && '✅ every module imported' || steps.imports.outcome == 'failure' && '❌ an import failed' || steps.imports.outcome == 'skipped' && '⏭️ skipped' || '🚫 cancelled' }}
            Commit: ${{ github.sha }}
