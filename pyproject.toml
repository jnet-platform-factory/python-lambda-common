[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lambda_app_common"
version = "2.0.0"
description = "Middleware for AWS Lambda services on Powertools: an API Gateway handler chain, an EventBridge/SQS/SES event middleware, and bounded telemetry."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  { name="Hector Reyes Aleman" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    "aws-lambda-powertools>=2.21",
    "pydantic>=2",
    "PyJWT>=2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
"Homepage" = "https://github.com/jnet-platform-factory/python-lambda-common"
"Bug Tracker" = "https://github.com/jnet-platform-factory/python-lambda-common/issues"

[tool.hatch.build.targets.wheel]
packages = ["lambda_app_common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
